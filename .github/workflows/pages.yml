name: Validate and deploy showcase to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate both bases and build Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHOWCASE_BASE_PATH: /terra-motion-skills/
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Set up pnpm and cache its store
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate workspace
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm validate:skills
          pnpm check:boundaries
          pnpm check:consumer
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate local root build
        env:
          SHOWCASE_BASE_PATH: /
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/local
        run: |
          pnpm test:e2e --output=test-results/local
          pnpm check:showcase
      - name: Validate Pages build
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/pages
        run: |
          pnpm test:e2e --output=test-results/pages
          pnpm check:showcase
      - name: Preserve browser reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Check public distribution permission for identity assets
        run: pnpm check:publication
      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/showcase/dist
          retention-days: 1

  deploy:
    name: Deploy validated artifact
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
