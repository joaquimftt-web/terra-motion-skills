        <h1 id="static-study-title">Exploração horizontal — protótipo local</h1>
        <p>
          Sem JavaScript, os quatro painéis abaixo permanecem em leitura vertical. As interações e a
          navegação sticky precisam de JavaScript; não são simuladas aqui.

        <h2>Confirme uma intenção.</h2>
        <p>

        </p>
        <h2>Mude sem perder o contexto.</h2>
        <p>
          Presence Transition controla entrada, saída e devolução de foco.
          <a href="%BASE_URL%reference/presence-transition.tsx">Código da recipe</a>
        </p>
        <h2>Encontre sua posição.</h2>
        <p>
          Scroll Progress indica posição real, sem afirmar que o conteúdo foi lido.
          <a href="%BASE_URL%reference/scroll-progress.tsx">Código da recipe</a>
        </p>
        <p>
          Scroll Reveal e Staggered Entrance são experimentados em blocos irmãos fora da faixa
